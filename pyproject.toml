[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "famulix"
version = "0.1.4"
description = "Offline personal-agent framework centered on long-term memory and personalization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Chen Chunzhe", email = "239626936+easy1ive@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
torch = [
  "torch>=2.2",
]
dev = [
  "hatchling",
  "build",
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
famulix = "famulix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/famulix"]

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "model: marks tests that require the torch extra",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
plugins = []
files = ["src/famulix"]

[[tool.mypy.overrides]]
module = ["famulix.salience_torch"]
ignore_missing_imports = true
