name: Bug report
description: Report a reproducible issue in famulix
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include a minimal synthetic or otherwise non-sensitive reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: famulix version
    validations:
      required: true
