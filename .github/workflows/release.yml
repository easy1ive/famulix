name: GitHub release artifacts
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
