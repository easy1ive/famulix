name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
      - name: Install development and CPU model extras
        run: |
          uv venv .venv --python "${{ matrix.python-version }}"
          uv pip install --python .venv/bin/python --index-strategy unsafe-best-match -e '.[dev,torch]' --extra-index-url https://download.pytorch.org/whl/cpu
      - run: make build
      - run: make test-all
      - run: make format-check
      - run: make lint
      - run: make typecheck

  examples:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create venv and install
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]" --index-strategy unsafe-best-match
      - name: Run examples
        run: |
          .venv/bin/python examples/01_recall_benchmark.py
          .venv/bin/python examples/02_contradiction_week.py
          .venv/bin/python examples/03_preference_loop.py
          .venv/bin/python examples/04_persona_day.py
          .venv/bin/python examples/05_privacy_demo.py
          .venv/bin/python examples/06_plan_tools_demo.py
          .venv/bin/python examples/07_session_replay.py
          .venv/bin/python examples/08_memory_graph_demo.py
          .venv/bin/python examples/09_reporting_demo.py
